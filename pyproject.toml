[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-a2ui"
version = "0.1.0rc1"
description = "Render A2UI 1.0 agent-generated user interfaces inside Streamlit apps"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "streamlit_a2ui/THIRD_PARTY_LICENSES.txt"]
requires-python = ">=3.10"
authors = [{ name = "jose chu", email = "jose.chu.dev@gmail.com" }]
keywords = ["streamlit", "a2ui", "agent", "generative-ui", "component", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = ["streamlit >= 1.59"]

[project.urls]
Homepage = "https://github.com/josechudev/streamlit-a2ui"
Source = "https://github.com/josechudev/streamlit-a2ui"
Issues = "https://github.com/josechudev/streamlit-a2ui/issues"
Changelog = "https://github.com/josechudev/streamlit-a2ui/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["streamlit_a2ui*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
streamlit_a2ui = ["frontend/build/**/*", "pyproject.toml", "renderer_capabilities.json", "THIRD_PARTY_LICENSES.txt"]

[tool.pytest.ini_options]
# The browser test in e2e/ is run on its own: `pytest e2e`.
testpaths = ["tests"]
filterwarnings = [
    # Raised by pytest-base-url (pulled in by pytest-playwright), not by our code.
    "ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning",
]
