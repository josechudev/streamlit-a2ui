version: 2
# Version updates go to develop (gitflow, see CONTRIBUTING.md). Security updates
# always target the default branch; GitHub does not let them choose.
updates:
  # The frontend's pins are deliberate: @a2ui/* are exact pins and dompurify is
  # held by an npm override (see docs/security.md and ADR-008). Upgrade them by hand.
  - package-ecosystem: npm
    target-branch: develop
    directory: /streamlit_a2ui/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@a2ui/*"
      - dependency-name: "dompurify"
      # Major versions are decisions, not routine bumps: React 19 needs a full
      # browser check, and @types/node follows the Node major CI runs (24).
      # Remove an entry when you decide to take that major.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # react, react-dom and their types only install together (their peer
    # ranges must match), so they always come as one pull request.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  # The Streamlit floor in pyproject.toml is set by CI's version matrix, so only
  # bump it when a new release falls outside the range. increase-if-necessary does that.
  - package-ecosystem: pip
    target-branch: develop
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary

  # Actions are pinned to commit SHAs. Dependabot updates the SHA and the version comment.
  - package-ecosystem: github-actions
    target-branch: develop
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
