name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test, browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHON_VERSION: "3.13"
      # Not STREAMLIT_*: Streamlit reads STREAMLIT_<OPTION> variables as CLI
      # options, so STREAMLIT_VERSION would be parsed as `streamlit --version`.
      PIN_STREAMLIT: "1.67.*"
    steps:
      # Third-party actions are pinned to a commit; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: streamlit_a2ui/frontend/package-lock.json

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: "Frontend: install"
        working-directory: streamlit_a2ui/frontend
        run: npm ci

      - name: "Frontend: format check"
        working-directory: streamlit_a2ui/frontend
        run: npm run format:check

      # clean + typecheck + vite build + source-map check + capabilities + licenses
      - name: "Frontend: build"
        working-directory: streamlit_a2ui/frontend
        run: npm run build

      - name: "Frontend: unit tests"
        working-directory: streamlit_a2ui/frontend
        run: npm test

      - name: "Python: install"
        run: |
          uv venv --python "$PYTHON_VERSION"
          uv pip install -e . "streamlit==$PIN_STREAMLIT" \
            "pytest==9.2.0" "ruff==0.17.5" "pytest-playwright==0.10.0" "playwright==1.65.2"

      - name: "Python: lint"
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .

      # Includes the wheel checks: builds the wheel with uv and inspects it.
      - name: "Python: tests"
        run: .venv/bin/pytest -q

      - name: "Browser: install Chromium"
        run: .venv/bin/playwright install --with-deps chromium

      - name: "Browser: smoke test"
        run: .venv/bin/pytest e2e -q --tracing retain-on-failure --output e2e-results

      - name: "Browser: upload trace on failure"
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: e2e-results
          retention-days: 7
          if-no-files-found: ignore
