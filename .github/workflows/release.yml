name: Release

# Pushing a tag `vX.Y.Z...` builds the package and publishes it to PyPI through
# Trusted Publishing (OIDC). There is no API token anywhere.
#
# Run by hand (workflow_dispatch) it is a dry run: it builds and checks the
# package, then stops before the publish job.
#
# The `pypi` environment (with the owner as required reviewer) and the PyPI
# pending publisher are set up by the owner. See CONTRIBUTING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to a commit; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: streamlit_a2ui/frontend/package-lock.json

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: "Frontend: install"
        working-directory: streamlit_a2ui/frontend
        run: npm ci

      # clean + typecheck + vite build + source-map check + capabilities + licenses
      - name: "Frontend: build"
        working-directory: streamlit_a2ui/frontend
        run: npm run build

      - name: Build sdist and wheel
        run: |
          uv build --sdist --out-dir dist
          uv build --wheel --out-dir dist

      - name: Build a wheel from the sdist without Node and compare
        run: |
          UV_DIR="$(dirname "$(command -v uv)")"
          env PATH="$UV_DIR:/usr/bin:/bin" bash -euo pipefail -c '
            if command -v node; then echo "node is still on PATH" >&2; exit 1; fi
            uv build --wheel --out-dir "$RUNNER_TEMP/from-sdist" dist/*.tar.gz
          '
          python3 scripts/compare_wheels.py dist/*.whl "$RUNNER_TEMP"/from-sdist/*.whl

      - name: Check metadata with twine
        run: uvx twine@7.0.0 check --strict dist/*

      # A tag publishes exactly one version, so the tag must name it. A dry run
      # has no tag to compare, so it only prints the version.
      - name: Check the tag matches the package version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="$(uv run --no-project --python 3.13 python -c '
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          ')"
          echo "package version: $VERSION"
          if [ "$EVENT_NAME" != "push" ]; then
            echo "dry run: not checking the tag ($REF_NAME)"
            exit 0
          fi
          if [ "${REF_NAME#v}" != "$VERSION" ]; then
            echo "tag $REF_NAME does not match package version $VERSION" >&2
            exit 1
          fi
          # The built wheel must carry that version too.
          ls dist/streamlit_a2ui-"$VERSION"-*.whl dist/streamlit_a2ui-"$VERSION".tar.gz

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    # Only a pushed version tag publishes. A manual run stops after `build`.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/streamlit-a2ui
    # The only job with this permission; it replaces the workflow default, so
    # nothing else is granted.
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
